name: Compilar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK debug
        run: gradle --no-daemon :app:assembleDebug
      - name: Comprobar permisos del APK (sin red)
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$AAPT" dump permissions "$APK" | tee /tmp/contador-permissions.txt
          if grep -Eq "uses-permission|permission:" /tmp/contador-permissions.txt; then
            echo "::error::La aplicación declara un permiso Android no esperado."
            exit 1
          fi
          if grep -Eq "android.permission.INTERNET|android.permission.ACCESS_NETWORK_STATE" /tmp/contador-permissions.txt; then
            echo "::error::El APK pide acceso a red."
            exit 1
          fi
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ContadorTruco-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
