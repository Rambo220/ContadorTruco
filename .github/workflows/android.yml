name: Compilar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar firma release (si existen secretos)
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_STORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" ]]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/contador-release.jks"
            chmod 600 "$RUNNER_TEMP/contador-release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/contador-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin secretos de firma: se generará APK release SIN FIRMAR (no instalable directamente)."
          fi
      - name: Compilar release optimizada
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verificar permisos offline y firma
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK" && test -f "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee /tmp/contador-permissions.txt
          if grep -Eq "uses-permission|permission:" /tmp/contador-permissions.txt; then
            echo "::error::El APK declara permisos Android inesperados."
            exit 1
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            "$APKSIGNER" verify --verbose "$APK"
          else
            if "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
              echo "::error::El APK sin firma configurada parece firmado inesperadamente."
              exit 1
            fi
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"
      - name: Publicar release firmada
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ContadorTruco-release-firmada
          path: ${{ steps.verify.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
      - name: Publicar release sin firmar
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ContadorTruco-release-SIN-FIRMAR
          path: ${{ steps.verify.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
      - name: Generar APK debug instalable si falta firma release
        if: steps.signing.outputs.signed != 'true'
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar debug instalable si falta firma release
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ContadorTruco-debug-instalable
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
